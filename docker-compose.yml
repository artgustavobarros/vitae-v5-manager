services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: v5
      POSTGRES_PASSWORD: v5
      POSTGRES_DB: v5_manager
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v5 -d v5_manager"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
