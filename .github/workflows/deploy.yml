# Valida toda mudança e publica na Hostinger depois do push na main.
name: CI e deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verificacoes:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://v5:v5@localhost:5432/v5_manager
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v5
          POSTGRES_PASSWORD: v5
          POSTGRES_DB: v5_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v5 -d v5_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Aplicar migrations
        run: pnpm db:migrate

      - name: Testes
        run: pnpm test

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  deploy:
    needs: verificacoes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Conferir variáveis obrigatórias para deploy
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_VM_ID: ${{ secrets.HOSTINGER_VM_ID }}
          APP_HOST: ${{ secrets.APP_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NARRADOR_EMAIL: ${{ secrets.NARRADOR_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          missing=0
          for name in HOSTINGER_API_KEY HOSTINGER_VM_ID APP_HOST POSTGRES_PASSWORD BETTER_AUTH_SECRET NARRADOR_EMAIL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta o secret $name em Settings → Secrets and variables → Actions"
              missing=1
            fi
          done
          for name in POSTGRES_PASSWORD; do
            if [ -n "${!name}" ] && ! [[ "${!name}" =~ ^[A-Za-z0-9]+$ ]]; then
              echo "::error::$name deve conter só letras e números (gere com: openssl rand -hex 32)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy no VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ secrets.HOSTINGER_VM_ID }}
          project-name: v5-manager
          docker-compose-path: docker-compose.prod.yml
          environment-variables: |
            APP_HOST=${{ secrets.APP_HOST }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            NARRADOR_EMAIL=${{ secrets.NARRADOR_EMAIL }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
